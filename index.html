<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>하늘까지 탑 쌓기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: 화면 전체가 하늘(캔버스) · 점수는 위 가운데 · 문제와 결과는 아래에서 올라오는 패널 */
  --ink:#1b2140;
  --muted:#5b6487;
  --panel:#fffdf6;
  --sun:#ffc93c;
  --line:rgba(27,33,64,.16);
  --good:#2f9e6b;
  --bad:#e0564f;
  --hud:#1b2140;
  --font-display:"Bagel Fat One","Black Han Sans",system-ui,sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
body.night{--hud:#ffffff}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:#78c4f0;font-family:var(--font-body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
button{font-family:var(--font-body)}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

.hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 22px) 72px 0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;color:var(--hud);transition:opacity .35s,color .6s}
.hud.hidden{opacity:0}
.score{font-family:var(--font-display);font-size:clamp(60px,17vw,88px);line-height:.95;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:4px}
.score small{font-size:.3em}
#score{display:inline-block}
#score.bump{animation:bump .22s ease-out}
.meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:14px}
.pill{padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.quizpill{background:var(--sun);color:var(--ink)}
body.night .pill{background:rgba(255,255,255,.14)}
body.night .pill.quizpill{background:var(--sun);color:var(--ink)}

.icon-btn{position:fixed;top:calc(env(safe-area-inset-top) + 16px);right:calc(env(safe-area-inset-right) + 16px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.6);color:var(--ink);display:grid;place-items:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);z-index:8}

/* 시작 화면 */
.intro{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 22px);color:var(--ink);transition:opacity .4s,visibility 0s}
.intro.hidden{opacity:0;visibility:hidden;transition:opacity .4s,visibility 0s .4s}
.intro-top{text-align:center}
.kicker{display:inline-block;font-size:14px;letter-spacing:.04em;color:var(--ink);background:rgba(255,255,255,.55);padding:4px 12px;border-radius:999px}
.intro h1{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,13vw,74px);line-height:1.02;letter-spacing:-.01em;text-wrap:balance;margin-top:10px}
.intro-bottom{width:100%;display:flex;flex-direction:column;gap:10px;align-items:center}
.setup{pointer-events:auto;width:100%;max-width:420px;background:rgba(255,253,246,.94);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(27,33,64,.16)}
.how{font-size:15px;line-height:1.5;word-break:keep-all}
.setup-row{display:flex;flex-direction:column;gap:6px}
.setup-label{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:15px;cursor:pointer}
.chip[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.start-btn{height:56px;border:0;border-radius:18px;background:var(--ink);color:#fff;font-family:var(--font-display);font-size:21px;cursor:pointer}
.best-line{font-size:14px;color:var(--ink);background:rgba(255,255,255,.65);padding:3px 12px;border-radius:999px}

/* 알림 */
.perfect{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 246px);transform:translateX(-50%);font-family:var(--font-display);font-size:22px;color:var(--ink);background:var(--sun);padding:6px 16px;border-radius:999px;opacity:0;pointer-events:none;white-space:nowrap;box-shadow:0 6px 18px rgba(27,33,64,.18);z-index:7}
.perfect.pop{animation:pop .9s ease-out forwards}
.banner{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 190px);transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:16px;font-size:15px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;box-shadow:0 10px 30px rgba(10,14,40,.3);z-index:7}
.banner b{font-family:var(--font-display);font-weight:400;color:var(--sun);margin-right:2px}
.banner.show{opacity:1;transform:translate(-50%,0)}

/* 아래에서 올라오는 패널: 문제, 결과 */
.panel{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(460px,calc(100% - 24px));max-height:calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 24px);overflow-y:auto;transform:translate(-50%,calc(100% + 40px));visibility:hidden;background:var(--panel);border-radius:28px;padding:20px 18px 18px;box-shadow:0 20px 60px rgba(10,14,40,.35);display:flex;flex-direction:column;gap:14px;transition:transform .45s cubic-bezier(.2,.9,.25,1.08),visibility 0s .45s;z-index:6}
.panel.show{transform:translate(-50%,0);visibility:visible;transition:transform .45s cubic-bezier(.2,.9,.25,1.08),visibility 0s}

.quiz-head{display:flex;align-items:center;gap:8px}
.tag{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sun);color:var(--ink);white-space:nowrap}
.quiz-count{font-size:13px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read-btn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:14px;cursor:pointer;white-space:nowrap}
.quiz-q{font-size:21px;line-height:1.45;text-wrap:balance;word-break:keep-all}
.quiz-ex{font-size:20px;line-height:1.5;text-align:center;padding:12px;border-radius:16px;background:rgba(255,201,60,.2);border:1.5px dashed rgba(27,33,64,.25);word-break:keep-all;font-variant-numeric:tabular-nums}
.quiz-fig{display:flex;justify-content:center}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.one{grid-template-columns:1fr}
.choice{min-height:58px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-size:18px;line-height:1.35;text-align:left;cursor:pointer;word-break:keep-all;transition:background .2s,opacity .2s}
.choices.one .choice{min-height:50px;font-size:16.5px}
.choice .num{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:rgba(27,33,64,.08)}
.choice.right{background:var(--good);border-color:var(--good);color:#fff}
.choice.wrong{background:var(--bad);border-color:var(--bad);color:#fff}
.choice.right .num,.choice.wrong .num{background:rgba(255,255,255,.25)}
.choice.dim{opacity:.45}
.choice:disabled{cursor:default}
.quiz-why{font-size:15.5px;line-height:1.6;padding:12px 14px;border-radius:16px;background:rgba(27,33,64,.05);word-break:keep-all}
.res{font-family:var(--font-display);font-size:17px;margin-right:8px}
.res.good{color:var(--good)}
.res.bad{color:var(--bad)}
.wide{height:54px;border:0;border-radius:18px;background:var(--ink);color:#fff;font-family:var(--font-display);font-size:19px;cursor:pointer}

.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;color:var(--muted)}
.final{font-family:var(--font-display);font-size:60px;line-height:.95;font-variant-numeric:tabular-nums;margin-top:4px}
.final small{font-size:.34em;margin-left:3px}
.final-alt{font-size:15px;margin-top:6px}
.badge{font-family:var(--font-display);font-size:14px;background:var(--sun);padding:6px 12px;border-radius:999px;transform:rotate(-5deg);white-space:nowrap}
.ladder{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.ladder li{font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:flex;gap:5px;white-space:nowrap}
.ladder li span{font-variant-numeric:tabular-nums;opacity:.75}
.ladder li.on{background:var(--ink);border-color:var(--ink);color:#fff}
.ladder li.next{border:1.5px dashed var(--ink);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(27,33,64,.05);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stats span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.stats b{font-family:var(--font-display);font-weight:400;font-size:21px;font-variant-numeric:tabular-nums}
.revive{height:52px;border:0;border-radius:18px;background:var(--sun);color:var(--ink);font-family:var(--font-display);font-size:17px;cursor:pointer}
.actions{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}
.actions button{height:54px;border-radius:18px;font-family:var(--font-display);font-size:18px;cursor:pointer;border:0}
.actions .primary{background:var(--ink);color:#fff}
.actions .ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

@keyframes bump{0%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.06)}30%{transform:translate(-50%,0) scale(1)}75%{opacity:1;transform:translate(-50%,-4px)}100%{opacity:0;transform:translate(-50%,-14px)}}
@keyframes fade{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){
  .perfect.pop{animation:fade .9s forwards}
  .panel,.panel.show,.banner{transition:visibility 0s}
}
</style>
</head>
<body>
<canvas id="game" aria-label="탑 쌓기 게임 화면. 화면을 탭하거나 스페이스 키를 눌러 블록을 내려놓아요."></canvas>

<div class="hud hidden" id="hud">
  <div class="score"><span id="score">0</span><small>층</small></div>
  <div class="meta">
    <span class="pill" id="alt">0m</span>
    <span class="pill" id="next">첨성대까지 1층</span>
    <span class="pill quizpill" id="quizPill">문제까지 3층</span>
  </div>
</div>

<button class="icon-btn" id="mute" type="button" aria-label="소리 끄기"></button>

<div class="intro" id="intro">
  <header class="intro-top">
    <p class="kicker">한 층 = 10m</p>
    <h1>하늘까지<br>탑 쌓기</h1>
  </header>
  <div class="intro-bottom">
    <div class="setup">
      <p class="how">블록을 탭해서 쌓아요. 중간에 나오는 문제를 맞히면 블록이 다시 넓어져요!</p>
      <div class="setup-row">
        <span class="setup-label" id="subjLabel">어떤 문제를 풀까요?</span>
        <div class="chips" role="radiogroup" aria-labelledby="subjLabel">
          <button class="chip" type="button" role="radio" data-subj="all">모두</button>
          <button class="chip" type="button" role="radio" data-subj="국어">국어</button>
          <button class="chip" type="button" role="radio" data-subj="수학">수학</button>
          <button class="chip" type="button" role="radio" data-subj="통합">통합교과</button>
        </div>
      </div>
      <div class="setup-row">
        <span class="setup-label" id="everyLabel">문제는 몇 층마다 나올까요?</span>
        <div class="chips" role="radiogroup" aria-labelledby="everyLabel">
          <button class="chip" type="button" role="radio" data-every="2">2층</button>
          <button class="chip" type="button" role="radio" data-every="3">3층</button>
          <button class="chip" type="button" role="radio" data-every="5">5층</button>
          <button class="chip" type="button" role="radio" data-every="0">문제 없이</button>
        </div>
      </div>
      <button class="start-btn" id="startBtn" type="button">시작하기</button>
    </div>
    <p class="best-line" id="introBest">첫 기록에 도전해 보세요</p>
  </div>
</div>

<div class="perfect" id="perfect" aria-hidden="true"></div>
<div class="banner" id="banner" role="status"><span id="bannerText"></span></div>

<section class="panel quiz" id="quiz" aria-labelledby="quizQ" aria-hidden="true">
  <div class="quiz-head">
    <span class="tag" id="quizTag">국어</span>
    <span class="quiz-count" id="quizCount">3층 문제</span>
    <button class="read-btn" id="readBtn" type="button"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>읽어 주기</button>
  </div>
  <p class="quiz-q" id="quizQ"></p>
  <div class="quiz-fig" id="quizFig" hidden></div>
  <p class="quiz-ex" id="quizEx" hidden></p>
  <div class="choices" id="choices"></div>
  <p class="quiz-why" id="quizWhy" hidden></p>
  <button class="wide" id="quizNext" type="button" hidden>계속 쌓기</button>
</section>

<section class="panel sheet" id="sheet" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-head">
    <div>
      <p class="eyebrow" id="sheetTitle">이번 기록</p>
      <p class="final"><span id="finalFloors">0</span><small>층</small></p>
      <p class="final-alt" id="finalAlt">0m</p>
    </div>
    <span class="badge" id="newBadge" hidden>신기록!</span>
  </div>
  <ul class="ladder" id="ladder" aria-label="넘어선 높이"></ul>
  <div class="stats">
    <div><span>최고 기록</span><b id="bestOut">0층</b></div>
    <div><span>맞힌 문제</span><b id="quizOut">0/0</b></div>
    <div><span>연속 정확</span><b id="comboOut">0번</b></div>
  </div>
  <button class="revive" id="reviveBtn" type="button">문제 맞히고 이어서 쌓기</button>
  <div class="actions">
    <button class="primary" id="again" type="button">다시 쌓기</button>
    <button class="ghost" id="copy" type="button">기록 복사</button>
  </div>
</section>

<script src="questions.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $('game');
  const ctx = canvas.getContext('2d');
  const hud = $('hud'), scoreEl = $('score'), altEl = $('alt'), nextEl = $('next'), quizPill = $('quizPill');
  const intro = $('intro'), introBest = $('introBest');
  const sheet = $('sheet'), perfectEl = $('perfect'), banner = $('banner'), bannerText = $('bannerText');
  const quizEl = $('quiz'), quizTag = $('quizTag'), quizCount = $('quizCount'), quizQ = $('quizQ'), quizEx = $('quizEx'), quizFig = $('quizFig');
  const choicesEl = $('choices'), quizWhy = $('quizWhy'), quizNext = $('quizNext'), readBtn = $('readBtn'), reviveBtn = $('reviveBtn');
  const muteBtn = $('mute');
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

  // ---- 규칙 ----
  const C30 = Math.cos(Math.PI / 6), S30 = 0.5;
  const BH = 0.24;        // 블록 높이(월드 단위)
  const BASE = 1;         // 첫 블록 한 변
  const RANGE = 1.35;     // 블록이 오가는 거리
  const PERFECT = 0.045;  // 이 안쪽이면 '정확'
  const GROW = 0.06;      // 연속 정확 3번부터 넓어지는 양
  const METERS = 10;      // 한 층 = 10m

  const LANDMARKS = [
    { name: '첨성대', m: 9 },
    { name: '피사의 사탑', m: 56 },
    { name: '자유의 여신상', m: 93 },
    { name: '63빌딩', m: 249 },
    { name: '에펠탑', m: 330 },
    { name: '롯데월드타워', m: 555 },
    { name: '부르즈 할리파', m: 828 },
    { name: '한라산', m: 1947 },
  ];
  // [고도(m), 하늘 위쪽 색, 하늘 아래쪽 색] — 올라갈수록 낮 → 노을 → 밤 → 우주
  const SKY = [
    [0,    [120, 196, 240], [226, 244, 255]],
    [250,  [92, 150, 214],  [255, 222, 170]],
    [550,  [64, 72, 150],   [255, 150, 120]],
    [850,  [22, 28, 70],    [110, 66, 128]],
    [1500, [6, 8, 22],      [26, 32, 78]],
  ];

  // ---- 문제 은행 (초등 2학년) ----
  const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  // 숫자 뒤 조사: 끝자리 0·1·3·6·7·8은 받침이 있어요(영·일·삼·육·칠·팔, 십·백·천)
  const jo = (n, withB, noB) => ([0, 1, 3, 6, 7, 8].includes(Math.abs(n) % 10) ? withB : noB);

  // 문제 목록은 questions.js에 있어요.
  const STATIC = Array.isArray(window.SKY_QUESTIONS) ? window.SKY_QUESTIONS : [];
  const fromRow = ([s, q, c, why, ex]) => () => ({ s, q, c, why, ex });

  function numChoices(ans, cands, unit = '') {
    const set = [ans];
    for (const v of cands) if (v > 0 && !set.includes(v) && set.length < 4) set.push(v);
    let k = 2;
    while (set.length < 4) { for (const v of [ans + k, ans - k]) if (v > 0 && !set.includes(v) && set.length < 4) set.push(v); k++; }
    return set.map((v) => v + unit);
  }
  function pickDistinct(right, cands) {
    const out = [right];
    for (const c of cands) if (!out.includes(c) && out.length < 4) out.push(c);
    return out;
  }
  function clockSVG(h, m) {
    let s = '<svg viewBox="0 0 120 120" width="132" height="132" role="img" aria-label="바늘이 있는 시계">';
    s += '<circle cx="60" cy="60" r="56" fill="#fff" stroke="#1b2140" stroke-width="3"/>';
    for (let i = 0; i < 60; i++) {
      if (i % 5 === 0) continue;
      const a = i * Math.PI / 30;
      s += `<line x1="${(60 + 51.5 * Math.sin(a)).toFixed(1)}" y1="${(60 - 51.5 * Math.cos(a)).toFixed(1)}" x2="${(60 + 54 * Math.sin(a)).toFixed(1)}" y2="${(60 - 54 * Math.cos(a)).toFixed(1)}" stroke="#9aa0b8" stroke-width="1"/>`;
    }
    for (let i = 1; i <= 12; i++) {
      const a = i * Math.PI / 6;
      s += `<text x="${(60 + 43 * Math.sin(a)).toFixed(1)}" y="${(60 - 43 * Math.cos(a)).toFixed(1)}" font-size="13" text-anchor="middle" dominant-baseline="central" fill="#1b2140" font-family="sans-serif">${i}</text>`;
    }
    const ha = ((h % 12) + m / 60) * Math.PI / 6, ma = m * Math.PI / 30;
    s += `<line x1="60" y1="60" x2="${(60 + 26 * Math.sin(ha)).toFixed(1)}" y2="${(60 - 26 * Math.cos(ha)).toFixed(1)}" stroke="#1b2140" stroke-width="5.5" stroke-linecap="round"/>`;
    s += `<line x1="60" y1="60" x2="${(60 + 41 * Math.sin(ma)).toFixed(1)}" y2="${(60 - 41 * Math.cos(ma)).toFixed(1)}" stroke="#e0564f" stroke-width="3.2" stroke-linecap="round"/>`;
    s += '<circle cx="60" cy="60" r="4" fill="#1b2140"/></svg>';
    return s;
  }
  function shapeSVG(n) {
    let inner;
    if (!n) inner = '<circle cx="60" cy="60" r="44"/>';

        ctx.fillStyle = `rgba(255,255,255,${(starA * tw).toFixed(3)})`;
        const y = (st.y * H + cam.y * unit * 0.06) % H;
        ctx.fillRect(st.x * W, y, st.r, st.r);
      }
    }
    drawClouds(dt);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 10 * shake);
    if (state !== 'ready') drawLandmarks();
    const topB = stack[stack.length - 1], ref = topB.x + topB.z;
    for (const d of debris) if (d.x + d.z < ref) drawBox(d, d.y, BH, debrisAlpha(d));
    drawBox(stack[0], -400, 400 + BH);
    const s = unit * cam.s;
    for (let i = 1; i < stack.length; i++) {
      const b = stack[i], y0 = i * BH;
      const minY = H * cam.a + ((b.x + b.z) * S30 - (b.w + b.d) * S30 * 0.5 - (y0 + BH - cam.y)) * s;
      if (minY > H + 4) continue;
      const maxY = H * cam.a + ((b.x + b.z) * S30 + (b.w + b.d) * S30 * 0.5 - (y0 - cam.y)) * s;
      if (maxY < -4) continue;
      drawBox(b, y0, BH);
    }
    if (current) drawBox(current, current.y, BH);
    for (const d of debris) if (d.x + d.z >= ref) drawBox(d, d.y, BH, debrisAlpha(d));
    drawRings();
    ctx.restore();
  }

  function update(dt) {
    if (current && (state === 'playing' || state === 'ready')) {
      const top = stack[stack.length - 1], p = current.axis;
      current[p] += current.dir * speed() * dt;
      if (current[p] > top[p] + RANGE) { current[p] = top[p] + RANGE; current.dir = -1; }
      else if (current[p] < top[p] - RANGE) { current[p] = top[p] - RANGE; current.dir = 1; }
    }
    const tb = stack[stack.length - 1];
    if (tb.grow) {
      const k2 = 1 - Math.exp(-dt * 9);
      tb.w += (BASE - tb.w) * k2; tb.d += (BASE - tb.d) * k2;
      if (BASE - tb.w < 0.003 && BASE - tb.d < 0.003) { tb.w = BASE; tb.d = BASE; tb.grow = false; }
    }
    if (pendingSpawn > 0) {
      pendingSpawn -= dt;
      if (pendingSpawn <= 0) {
        pendingSpawn = 0;
        if (state === 'playing' && !current) { if (tb.grow) { tb.w = BASE; tb.d = BASE; tb.grow = false; } spawn(); }
      }
    }
    for (const d of debris) { d.vy -= 14 * dt; d.y += d.vy * dt; d[d.axis] += d.v * dt; d.life += dt; }
    debris = debris.filter((d) => d.life < 2 && d.y > cam.y - 30);
    for (const r of rings) r.t += dt;
    rings = rings.filter((r) => r.t < 0.6);
    const k = 1 - Math.exp(-dt * 5);
    cam.y += (cam.ty - cam.y) * k; cam.s += (cam.ts - cam.s) * k; cam.a += (cam.ta - cam.a) * k;
    skyM += (score * METERS - skyM) * (1 - Math.exp(-dt * 2));
    if (shake > 0) shake = Math.max(0, shake - dt * 3);
    const night = skyM > 450;
    if (night !== isNight) { isNight = night; document.body.classList.toggle('night', night); }
  }

  // ---- 게임 진행 ----
  function spawn() {
    const top = stack[stack.length - 1];
    const axis = stack.length % 2 === 0 ? 'x' : 'z';
    const side = Math.random() < 0.5 ? -1 : 1;
    current = { x: top.x, z: top.z, w: top.w, d: top.d, hue: hueAt(stack.length), axis, dir: -side, y: stack.length * BH };
    current[axis] = top[axis] + side * RANGE;
  }
  function reset() {
    hue0 = Math.floor(Math.random() * 360);
    stack = [{ x: 0, z: 0, w: BASE, d: BASE, hue: hueAt(0), y: 0 }];
    debris = []; rings = []; score = 0; combo = 0; maxCombo = 0; landmarkIdx = 0; shake = 0;
    quizTotal = 0; quizRight = 0; reviveUsed = false; pendingSpawn = 0; gameStartBest = best;
    cam.ty = BH; cam.ts = 1; cam.ta = 0.45;
    spawn();
  }
  function showPerfect(text) {
    perfectEl.textContent = text;
    perfectEl.classList.remove('pop'); void perfectEl.offsetWidth; perfectEl.classList.add('pop');
  }
  let bannerTimer = 0;
  function showBanner(L) {
    bannerText.innerHTML = `<b>${L.name}</b> 높이(${L.m.toLocaleString()}m)를 넘었어요`;
    banner.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => banner.classList.remove('show'), 2200);
  }
  function updateHud(bump) {
    const m = score * METERS;
    scoreEl.textContent = score;
    altEl.textContent = `${m.toLocaleString()}m`;
    const L = LANDMARKS[landmarkIdx];
    nextEl.textContent = L ? `${L.name}까지 ${Math.floor((L.m - m) / METERS) + 1}층` : '한라산보다 높아요';
    if (quizEvery > 0) { quizPill.hidden = false; quizPill.textContent = `문제까지 ${quizEvery - (score % quizEvery)}층`; }
    else quizPill.hidden = true;
    if (bump && !reduceMotion) { scoreEl.classList.remove('bump'); void scoreEl.offsetWidth; scoreEl.classList.add('bump'); }
  }

  function place() {
    const top = stack[stack.length - 1];
    const p = current.axis, k = p === 'x' ? 'w' : 'd';
    const delta = current[p] - top[p], ad = Math.abs(delta), size = current[k];

    if (ad >= size) { // 완전히 빗나감
      debris.push({ ...current, v: Math.sign(delta) * 0.9, vy: 0, life: 0 });
      current = null;
      gameOver();
      return;
    }
    const placed = { ...current };
    let perfect = false;
    if (ad <= PERFECT) {
      perfect = true;
      placed[p] = top[p];
      combo++; maxCombo = Math.max(maxCombo, combo);
      if (combo >= 3) placed[k] = Math.min(BASE, placed[k] + GROW);
      sfxPerfect(combo); buzz(18);
      showPerfect(combo >= 2 ? `정확해요 ×${combo}` : '정확해요!');
    } else {
      combo = 0;
      const ns = size - ad, nc = top[p] + delta / 2;
      placed[k] = ns; placed[p] = nc;
      const cut = { ...current, axis: p, v: Math.sign(delta) * 0.6, vy: 0, life: 0 };
      cut[k] = ad; cut[p] = nc + Math.sign(delta) * (ns / 2 + ad / 2);
      debris.push(cut);
      sfxPlace(); buzz(8);
    }
    const i = stack.length;
    placed.y = i * BH;
    stack.push(placed);
    current = null;
    score = stack.length - 1;
    if (perfect) rings.push({ x: placed.x, z: placed.z, w: placed.w, d: placed.d, y: (i + 1) * BH, t: 0 });
    cam.ty = stack.length * BH;

    const m = score * METERS;
    let passedNow = null;
    while (landmarkIdx < LANDMARKS.length && m > LANDMARKS[landmarkIdx].m) { passedNow = LANDMARKS[landmarkIdx]; landmarkIdx++; }
    if (passedNow) { showBanner(passedNow); sfxLandmark(); }
    updateHud(true);

    if (quizEvery > 0 && score % quizEvery === 0) {
      state = 'quiz-wait';
      setTimeout(() => { if (state === 'quiz-wait') openQuiz('floor'); }, 450);
    }
  }

  // ---- 문제 ----
  function openQuiz(mode) {
    quizMode = mode; curQ = nextQuestion(); answered = false; lastOk = false;
    order = shuffle(curQ.c.map((_, i) => i));
    quizTag.textContent = curQ.s;
    quizCount.textContent = mode === 'revive' ? '맞히면 이어서 쌓을 수 있어요' : `${score}층 문제`;
    quizQ.textContent = curQ.q;
    if (curQ.ex) { quizEx.textContent = curQ.ex; quizEx.hidden = false; } else quizEx.hidden = true;
    if (curQ.fig) { quizFig.innerHTML = curQ.fig; quizFig.hidden = false; } else { quizFig.innerHTML = ''; quizFig.hidden = true; }
    choicesEl.classList.toggle('one', curQ.c.some((t) => String(t).length > 7));
    choicesEl.innerHTML = '';
    order.forEach((oi, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'choice';
      const num = document.createElement('span'); num.className = 'num'; num.textContent = i + 1;
      const txt = document.createElement('span'); txt.textContent = curQ.c[oi];
      b.append(num, txt);
      b.addEventListener('click', () => answer(i));
      choicesEl.appendChild(b);
    });
    quizWhy.hidden = true; quizNext.hidden = true;
    state = 'quiz';
    if (mode === 'floor') cam.ta = 0.3;
    quizEl.inert = false; quizEl.setAttribute('aria-hidden', 'false'); quizEl.classList.add('show');
    quizEl.scrollTop = 0;
    sfxQuiz();
  }
  function answer(i) {
    if (answered || state !== 'quiz' || i >= order.length) return;
    answered = true; quizTotal++;
    stopSpeech();
    const ok = order[i] === 0;
    lastOk = ok;
    [...choicesEl.children].forEach((b, j) => {
      b.disabled = true;
      if (order[j] === 0) b.classList.add('right');
      else if (j === i) b.classList.add('wrong');
      else b.classList.add('dim');
    });
    quizWhy.textContent = '';
    const res = document.createElement('span');
    res.className = 'res ' + (ok ? 'good' : 'bad');
    res.textContent = ok ? '정답이에요!' : '아쉬워요';
    quizWhy.append(res);
    if (ok) {
      quizRight++; sfxRight(); buzz(20);
      quizWhy.append(quizMode === 'revive' ? '이어서 쌓을 수 있어요.' : '블록이 다시 넓어져요.');
    } else {
      sfxWrong(); buzz([20, 30, 20]);
      const b = document.createElement('b'); b.textContent = curQ.c[0];
      quizWhy.append('정답: ', b);
    }
    quizWhy.append(document.createElement('br'), curQ.why);
    quizNext.textContent = ok ? (quizMode === 'revive' ? '이어서 쌓기' : '넓혀서 계속 쌓기') : (quizMode === 'revive' ? '결과 보기' : '계속 쌓기');
    quizWhy.hidden = false; quizNext.hidden = false;
    try { quizNext.focus({ preventScroll: true }); quizNext.scrollIntoView({ block: 'nearest' }); } catch (e) {}
  }
  function hideQuiz() {
    quizEl.classList.remove('show'); quizEl.setAttribute('aria-hidden', 'true'); quizEl.inert = true;
  }
  function growTop() {
    const t = stack[stack.length - 1];
    if (t.w < BASE || t.d < BASE) t.grow = true;
    rings.push({ x: t.x, z: t.z, w: BASE, d: BASE, y: stack.length * BH, t: 0 });
    sfxGrow();
  }
  function closeQuiz() {
    if (state !== 'quiz' || !answered) return;
    stopSpeech();
    hideQuiz();
    if (quizMode === 'floor') {
      if (lastOk) growTop();
      state = 'playing'; cam.ta = 0.45; pendingSpawn = lastOk ? 0.45 : 0.2;
      updateHud(false);
    } else {
      reviveUsed = true;
      if (lastOk) {
        growTop();
        state = 'playing'; cam.ta = 0.45; cam.ts = 1; cam.ty = stack.length * BH; pendingSpawn = 0.6;
        hud.classList.remove('hidden'); updateHud(false);
      } else {
        state = 'over'; showSheet();
      }
    }
  }
  quizNext.addEventListener('click', closeQuiz);

  // ---- 끝 ----
  function gameOver() {
    state = 'over';
    overAt = performance.now();
    sfxOver(); buzz([30, 40, 30]);
    if (!reduceMotion) shake = 1;
    if (score > best) { best = score; store.set('sky-stack-best', best); }
    const topY = stack.length * BH;
    cam.ta = 0.34; cam.ty = topY * 0.5;
    cam.ts = clamp((H * 0.36) / ((topY + 0.6) * unit), 0.06, 1);
    hud.classList.add('hidden');
    banner.classList.remove('show');
    setTimeout(() => { if (state === 'over') showSheet(); }, 750);
  }
  function showSheet() {
    fillSheet(score > gameStartBest && score > 0);
    reviveBtn.hidden = reviveUsed || quizEvery === 0;
    sheet.inert = false; sheet.setAttribute('aria-hidden', 'false'); sheet.classList.add('show');
    sheet.scrollTop = 0;
    try { $('again').focus({ preventScroll: true }); } catch (e) {}
  }
  function hideSheet() {
    sheet.classList.remove('show'); sheet.inert = true; sheet.setAttribute('aria-hidden', 'true');
  }
  function fillSheet(isNew) {
    const m = score * METERS;
    const passed = LANDMARKS.filter((L) => m > L.m);
    const topL = passed[passed.length - 1];
    $('finalFloors').textContent = score;
    $('finalAlt').textContent = topL ? `${m.toLocaleString()}m · ${topL.name}보다 높아요` : `${m}m · 첨성대(9m)부터 넘어 봐요`;
    $('ladder').innerHTML = LANDMARKS.map((L, i) =>
      `<li class="${m > L.m ? 'on' : (i === passed.length ? 'next' : '')}">${L.name}<span>${L.m.toLocaleString()}m</span></li>`).join('');
    $('bestOut').textContent = `${best}층`;
    $('quizOut').textContent = `${quizRight}/${quizTotal}`;
    $('comboOut').textContent = `${maxCombo}번`;
    $('newBadge').hidden = !isNew;
  }
  function start() {
    if (state !== 'ready') return;
    state = 'playing';
    gameStartBest = best;
    intro.classList.add('hidden');
    hud.classList.remove('hidden');
    updateHud(false);
  }
  function restart() {
    hideSheet(); hideQuiz(); stopSpeech();
    reset();
    cam.y = cam.ty; cam.s = cam.ts; cam.a = cam.ta;
    state = 'playing';
    hud.classList.remove('hidden');
    updateHud(false);
  }
  function act() {
    ensureAudio();
    if (state === 'ready') { start(); return; }
    if (state === 'playing' && current) { place(); if (state === 'playing') spawn(); }
  }

  // ---- 시작 화면 고르기 ----
  function renderSetup() {
    document.querySelectorAll('[data-subj]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.subj === subj)));
    document.querySelectorAll('[data-every]').forEach((b) => b.setAttribute('aria-checked', String(+b.dataset.every === quizEvery)));
  }
  document.querySelectorAll('[data-subj]').forEach((b) => b.addEventListener('click', () => {
    subj = b.dataset.subj; store.set('sky-stack-subj', subj); bag = []; renderSetup();
  }));
  document.querySelectorAll('[data-every]').forEach((b) => b.addEventListener('click', () => {
    quizEvery = +b.dataset.every; store.set('sky-stack-every', quizEvery); renderSetup();
  }));
  $('startBtn').addEventListener('click', () => { ensureAudio(); start(); });

  // ---- 입력 ----
  window.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.target.closest && e.target.closest('button, .panel, .setup')) return;
    act();
  });
  window.addEventListener('keydown', (e) => {
    if (state === 'quiz' && /^[1-4]$/.test(e.key)) { e.preventDefault(); answer(+e.key - 1); return; }
    if (e.code !== 'Space' && e.code !== 'Enter') return;
    if (e.target.closest && e.target.closest('button')) return;
    e.preventDefault();
    if (state === 'quiz') { if (answered) closeQuiz(); return; }
    if (state === 'over') { if (performance.now() - overAt > 900) restart(); return; }
    act();
  });
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  $('again').addEventListener('click', () => { ensureAudio(); restart(); });
  reviveBtn.addEventListener('click', () => {
    if (state !== 'over' || reviveUsed) return;
    ensureAudio(); hideSheet();
    setTimeout(() => { if (state === 'over') openQuiz('revive'); }, 300);
  });
  $('copy').addEventListener('click', async () => {
    const btn = $('copy'), m = score * METERS;
    const passed = LANDMARKS.filter((L) => m > L.m).pop();
    const text = `하늘까지 탑 쌓기에서 ${score}층(${m.toLocaleString()}m)까지 쌓았어요!`
      + (passed ? ` ${passed.name}보다 높아요.` : '')
      + (quizTotal ? ` 문제는 ${quizTotal}개 중 ${quizRight}개 맞혔어요.` : '');
    try { await navigator.clipboard.writeText(text); btn.textContent = '복사했어요'; }
    catch (err) { btn.textContent = '복사가 막혔어요'; }
    setTimeout(() => { btn.textContent = '기록 복사'; }, 1600);
  });
  window.addEventListener('resize', resize);

  function frame(t) {
    const dt = Math.min(0.05, Math.max(0, (t - last) / 1000));
    last = t; time += dt;
    update(dt); render(dt);
    requestAnimationFrame(frame);
  }

  window.claude?.hot?.snapshot(() => ({ best }));
  function boot(data) {
    best = Math.max(+store.get('sky-stack-best', '0') || 0, (data && +data.best) || 0);
    introBest.textContent = best > 0 ? `최고 기록 ${best}층` : '첫 기록에 도전해 보세요';
    sheet.inert = true; quizEl.inert = true;
    renderMute(); renderSetup();
    resize(); makeSky(); reset();
    requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
